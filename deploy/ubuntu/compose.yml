name: nexvary-voice
services:
  voice-engine:
    build:
      context: ../..
      dockerfile: deploy/ubuntu/Dockerfile
    image: nexvary-voice-engine:0.3.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:${NEXVARY_VOICE_PORT:-18781}:8000"
    environment:
      ARGOS_PACKAGES_DIR: /models/argos
      HF_HOME: /models/huggingface
      XDG_CACHE_HOME: /models/cache
      NEXVARY_WHISPER_MODEL: ${NEXVARY_WHISPER_MODEL:-small}
      NEXVARY_PIPER_VOICES: ${NEXVARY_PIPER_VOICES:?Set explicit Piper voice JSON in .env}
      NEXVARY_API_TOKEN: ${NEXVARY_API_TOKEN:?Set a strong API token in .env}
    volumes:
      - voice-models:/models
    user: "10001:10001"
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 3g
    tmpfs:
      - /tmp:size=256m,mode=1777
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 30s

volumes:
  voice-models:
