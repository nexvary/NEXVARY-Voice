name: nexvary-voice-gateway
services:
  gateway:
    build:
      context: ../..
      dockerfile: deploy/ubuntu/Dockerfile.gateway
    image: nexvary-voice-gateway:0.1.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:${NEXVARY_GATEWAY_PORT:-18782}:8000"
    environment:
      NEXVARY_GATEWAY_TOKEN: ${NEXVARY_GATEWAY_TOKEN:?Set gateway token}
      NEXVARY_WORKER_URL: ${NEXVARY_WORKER_URL:-}
      NEXVARY_WORKER_TOKEN: ${NEXVARY_WORKER_TOKEN:-}
      NEXVARY_ALLOW_PRIVATE_HTTP_WORKER: "0"
    mem_limit: 256m
    cpus: "0.5"
    pids_limit: 64
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=96m,mode=1777
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
