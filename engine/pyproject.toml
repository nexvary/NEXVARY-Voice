[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexvary-voice-engine"
version = "0.1.0"
description = "NEXVARY Voice translation API and subtitle tools"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.30,<1.0",
]

[project.optional-dependencies]
offline = ["argostranslate>=1.9,<2.0"]
dev = ["pytest>=8,<10", "httpx>=0.27,<1.0"]

[tool.setuptools.packages.find]
include = ["voice_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
