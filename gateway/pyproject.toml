[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexvary-voice-gateway"
version = "0.1.0"
description = "Isolated low-memory reverse gateway for NEXVARY Voice speech inference"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "websockets>=14,<17", "python-multipart>=0.0.18,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["voice_gateway*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
