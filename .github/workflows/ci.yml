name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  engine:
    name: Engine tests
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: engine/pyproject.toml
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Test engine
        run: python -m pytest -q
      - name: Compile Python
        run: python -m compileall -q voice_engine
  android:
    name: Android APK and JVM tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build and unit tests
        run: gradle :app:assembleDebug :app:testDebugUnitTest --stacktrace --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: NEXVARY-Voice-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  ubuntu-deploy-config:
    name: Ubuntu Compose validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check deployment shell syntax
        run: bash -n deploy/ubuntu/preflight.sh deploy/ubuntu/safe-up.sh
      - name: Validate isolated Compose configuration
        run: docker compose --env-file deploy/ubuntu/.env.example -f deploy/ubuntu/compose.yml config --quiet
      - name: Build Ubuntu speech engine container
        run: docker build --progress=plain -f deploy/ubuntu/Dockerfile -t nexvary-voice:ci .
        timeout-minutes: 12

  gateway-tests:
    name: Lightweight gateway tests
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install gateway
        run: python -m pip install -e ".[dev]"
      - name: Tests
        run: python -m pytest -q
      - name: Compile Python
        run: python -m compileall -q voice_gateway

  gateway-container:
    name: Lightweight gateway container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate gateway Compose
        run: docker compose --env-file deploy/ubuntu/.env.gateway.example -f deploy/ubuntu/compose.gateway.yml config --quiet
      - name: Build gateway container
        run: docker build -f deploy/ubuntu/Dockerfile.gateway -t nexvary-voice-gateway:test .
