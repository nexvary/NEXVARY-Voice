name: Windows Desktop Release Build
on:
  push:
    branches: [main]
    paths:
      - "engine/**"
      - "tools/windows/**"
      - ".github/workflows/windows-desktop.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-exe:
    name: Windows GUI EXE and Installer
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install graphical dependencies
        shell: pwsh
        run: |
          python -m pip install -e "./engine[desktop,dev]"
          python -m pip install "pyinstaller>=6.10,<7" "pillow>=10,<13" "uv==0.13.0"
      - name: Validate PowerShell model setup syntax
        shell: pwsh
        run: |
          foreach ($script in @("tools/windows/setup-languages.ps1", "tools/windows/download-voices.ps1", "tools/windows/start-engine.ps1")) {
            $null = [scriptblock]::Create((Get-Content -Raw $script))
          }
      - name: All engine and graphical tests
        shell: pwsh
        run: python -m pytest engine/tests -q --junitxml=build/test-results.xml
      - name: Qt headless UI smoke test
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m voice_engine.desktop_app --self-test
      - name: Generate application icon
        run: python tools/windows/make_icon.py
      - name: Freeze standalone Windows GUI
        shell: pwsh
        run: |
          $uvBin = (python -c "import uv; print(uv.find_uv_bin())").Trim()
          if (-not (Test-Path $uvBin)) { throw "Bundled uv executable not found" }
          pyinstaller --noconfirm --clean --onedir --windowed --name NEXVARY-Voice `
            --icon build/assets/nexvary-voice.ico `
            --paths engine `
            --add-binary "$uvBin;bin" `
            --add-data "engine/pyproject.toml;engine" `
            --add-data "engine/voice_engine;engine/voice_engine" `
            --hidden-import PySide6.QtSvg `
            --hidden-import sounddevice `
            --hidden-import websockets.sync.client `
            tools/windows/app_entry.py
      - name: Test built EXE
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $exe = (Resolve-Path ".\dist\NEXVARY-Voice\NEXVARY-Voice.exe").Path
          # GUI-subsystem apps launched with & can return before process completion.
          $proc = Start-Process -FilePath $exe -ArgumentList "--self-test" -Wait -PassThru
          Write-Host "Frozen GUI smoke exit: $($proc.ExitCode)"
          if ($proc.ExitCode -ne 0) { throw "Windows executable smoke test failed: $($proc.ExitCode)" }
      - name: Capture frozen application screenshots
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $exe = (Resolve-Path ".\dist\NEXVARY-Voice\NEXVARY-Voice.exe").Path
          $images = Join-Path $env:GITHUB_WORKSPACE "build/screenshots"
          $proc = Start-Process -FilePath $exe -ArgumentList @("--screenshots", $images) -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "Screenshot capture failed" }
      - name: Locate Inno Setup compiler
        id: inno
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed" }
          }
          if (-not (Test-Path $iscc)) { throw "Inno Setup 6 compiler not found" }
          "compiler=$iscc" >> $env:GITHUB_OUTPUT
      - name: Build Windows installer
        shell: pwsh
        run: |
          & "${{ steps.inno.outputs.compiler }}" tools\windows\NEXVARY-Voice.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed" }
      - name: Create portable ZIP
        shell: pwsh
        run: Compress-Archive -Path dist/NEXVARY-Voice -DestinationPath dist/NEXVARY-Voice-Portable-v0.5.1.zip
      - name: SHA-256 checksums
        shell: pwsh
        run: |
          $files = @(".\dist\NEXVARY-Voice\NEXVARY-Voice.exe", ".\dist\installers\NEXVARY-Voice-Setup-v0.5.1.exe", ".\dist\NEXVARY-Voice-Portable-v0.5.1.zip")
          foreach ($f in $files) {
            $hash = (Get-FileHash $f -Algorithm SHA256).Hash.ToLower()
            "$hash  $(Split-Path $f -Leaf)" | Add-Content -Path ".\dist\SHA256SUMS.txt"
          }
          Get-Content .\dist\SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: NEXVARY-Voice-Windows-Portable
          path: dist/NEXVARY-Voice-Portable-v0.5.1.zip
          if-no-files-found: error
          retention-days: 21
      - uses: actions/upload-artifact@v4
        with:
          name: NEXVARY-Voice-Windows-Setup
          path: |
            dist/installers/NEXVARY-Voice-Setup-v0.5.1.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 21

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NEXVARY-Voice-Windows-Evidence
          path: |
            build/test-results.xml
            build/screenshots/
          if-no-files-found: warn
          retention-days: 21

  real-models:
    if: ${{ !contains(github.event.head_commit.message, '[skip real-models]') }}
    name: Real CPU models — six languages and dubbed MP4
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install GUI and bundled runtime manager
        run: python -m pip install -e "./engine[desktop,dev]" "uv==0.13.0"
      - name: Exercise isolated GUI setup with actual downloads and inference
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONUTF8: '1'
        run: python tools/windows/real_model_check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NEXVARY-Voice-Real-Model-Evidence
          path: |
            build/real-model-results.json
            build/real-model-log.txt
            build/real-model-evidence/
          if-no-files-found: warn
          retention-days: 21
