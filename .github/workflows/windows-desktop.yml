name: Windows Desktop Release Build
on:
  push:
    branches: [main]
    paths:
      - "engine/**"
      - "tools/windows/**"
      - ".github/workflows/windows-desktop.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-exe:
    name: Windows GUI EXE and Installer
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install graphical dependencies
        shell: pwsh
        run: |
          python -m pip install -e "./engine[desktop,dev]"
          python -m pip install "pyinstaller>=6.10,<7" "pillow>=10,<13"
      - name: Desktop API tests
        shell: pwsh
        run: python -m pytest engine/tests/test_desktop_api.py -q
      - name: Qt headless UI smoke test
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m voice_engine.desktop_app --self-test
      - name: Generate application icon
        run: python tools/windows/make_icon.py
      - name: Freeze standalone Windows GUI
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onedir --windowed --name NEXVARY-Voice `
            --icon build/assets/nexvary-voice.ico `
            --paths engine `
            --hidden-import PySide6.QtSvg `
            --hidden-import sounddevice `
            --hidden-import websockets.sync.client `
            tools/windows/app_entry.py
      - name: Test built EXE
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          & .\dist\NEXVARY-Voice\NEXVARY-Voice.exe --self-test
          if ($LASTEXITCODE -ne 0) { throw "Windows executable smoke test failed" }
      - name: Locate Inno Setup compiler
        id: inno
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed" }
          }
          if (-not (Test-Path $iscc)) { throw "Inno Setup 6 compiler not found" }
          "compiler=$iscc" >> $env:GITHUB_OUTPUT
      - name: Build Windows installer
        shell: pwsh
        run: |
          & "${{ steps.inno.outputs.compiler }}" tools\windows\NEXVARY-Voice.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed" }
      - name: SHA-256 checksums
        shell: pwsh
        run: |
          $files = @(".\dist\NEXVARY-Voice\NEXVARY-Voice.exe", ".\dist\installers\NEXVARY-Voice-Setup-v0.4.0.exe")
          foreach ($f in $files) {
            $hash = (Get-FileHash $f -Algorithm SHA256).Hash.ToLower()
            "$hash  $(Split-Path $f -Leaf)" | Add-Content -Path ".\dist\SHA256SUMS.txt"
          }
          Get-Content .\dist\SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: NEXVARY-Voice-Windows-Portable
          path: dist/NEXVARY-Voice/
          if-no-files-found: error
          retention-days: 21
      - uses: actions/upload-artifact@v4
        with:
          name: NEXVARY-Voice-Windows-Setup
          path: |
            dist/installers/NEXVARY-Voice-Setup-v0.4.0.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 21
